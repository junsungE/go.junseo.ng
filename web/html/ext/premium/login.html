<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium sign in</title>
    <meta name="description" content="Go URL Shortener premium sign in">
    <link rel="icon" href="/media/go_favicon.ico?v=2" sizes="48x48" type="image/x-icon">
    <link rel="shortcut icon" href="/media/go_favicon.ico?v=2" type="image/x-icon">
    <link rel="stylesheet" href="premiumsign.css">
</head>
<body style="background-image: url('/media/doggles.webp'); background-position: 50%; background-size: cover; min-height: 100vh;">
    <header class="classification">EXTERNAL</header>
        <main class="container">
            <h2>Sign in</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Email or Display Name" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <p id="message"></p>
            <p>Don't have an account? <a href="/ext/premium/signup">Sign up</a></p>
        </main>
    <footer class="classification">EXTERNAL</footer>

    <script src="auth.js"></script>

</body>
</html>
