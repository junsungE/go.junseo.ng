<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Dashboard</title>
    <meta name="description" content="Go Dashboard">
    <link rel="icon" href="/media/go_favicon.ico?v=2" sizes="48x48" type="image/x-icon">
    <link rel="shortcut icon" href="/media/go_favicon.ico?v=2" type="image/x-icon">
    <link rel="stylesheet" href="/internal/dashboard.css">
  </head>
  <body>
    <header class="classification">INTERNAL</header>

      <nav id="logout-nav"></nav>

      <h1>Dashboard / Analytics</h1>

      <nav>
          <a href="/">Home</a>
          <a href="/internal/new">Internal URL Shortener</a>
      </nav>

      <main>
        <h2>Fetch Stats</h2>
        <form id="fetchForm">
          <label>
            Slug (Optional):
            <input type="text" name="slug">
          </label>

          <fieldset class="type-checkboxes">
            <legend>Type:</legend>
            <label><input type="checkbox" name="type" value="internal" checked> Internal</label>
            <label><input type="checkbox" name="type" value="premium"> Premium</label>
            <label><input type="checkbox" name="type" value="free"> Free</label>
          </fieldset>

          <button type="submit">Fetch</button>
        </form>

        <p id="error"></p>

        <section id="statsSection" class="table-wrapper"></section>

        <hr style="margin: 30px 0;">

        <h2>Premium Users</h2>
          <section id="adminLoginSection" style="margin-bottom: 20px; border-bottom: 2px solid var(--bg); padding-bottom: 20px;">
            <form id="adminLoginForm" style="display: flex; gap: 10px; align-items: flex-end;">
              <label style="flex-grow: 1;">
                Admin Authentication:
                <input type="password" id="adminSecretInput" placeholder="Enter Admin Secret" required>
              </label>
              <button type="submit" style="height: 40px;">Verify</button>
            </form>
            <p id="adminStatus" style="font-size: 0.9em; margin-top: 5px;"></p>
          </section>
        <p id="usersLoading" style="display: none; margin-bottom: 10px;">Loading users...</p>
        <section style="overflow-x: auto;">
          <table class="stats-table" id="usersTable">
            <thead>
              <tr>
                <th>Display Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Last Sign In</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </section>

      </main>

    <footer class="classification">INTERNAL</footer>

    <script src="/internal/logout-nav.js"></script>
    <script src="/internal/dashboard.js"></script>

  </body>
</html>
