<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal URL Shortener</title>
    <meta name="description" content="Internal URL Shortener">
    <link rel="icon" href="/media/go_favicon.ico?v=2" sizes="48x48" type="image/x-icon">
    <link rel="shortcut icon" href="/media/go_favicon.ico?v=2" type="image/x-icon">
    <link rel="stylesheet" href="/internal/new.css">
  </head>
  <body>
    <header class="classification">INTERNAL</header>

      <nav id="logout-nav"></nav>

      <nav aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/internal/dashboard">Dashboard</a>
      </nav>

      <main>
        <h2>Go URL Shortener</h2>
        <form id="createForm" class="space-y-3">
          <label>
            Target URL:
            <input type="url" name="targetUrl" required>
          </label>

          <label>
            Custom Slug (optional):
            <input type="text" name="slug">
          </label>

          <label>
            Mode:
            <select name="mode">
              <option value="public">Public</option>
              <option value="protected">Protected</option>
              <option value="private">Private</option>
            </select>
          </label>

          <label id="passwordRow" style="display:none">
            Password (for protected mode):
            <input id="passwordInput" type="text" name="password">
          </label>

          <label>
            Start Date (optional):
            <input type="date" name="startDate">
          </label>

          <label>
            Expiry Date (optional):
            <input type="date" name="expiryDate">
          </label>

          <label>
            Visit Limit (optional):
            <input type="number" name="visitLimit">
          </label>

          <label>
            Title (optional, for notes):
            <input type="text" name="title">
          </label>

          <fieldset id="tagsFieldset">
            <legend>Tags (optional)</legend>
            <section class="tags-container">
              <ul id="selectedTags" class="selected-tags-list" aria-label="Selected tags"></ul>
              <input type="text" id="tagInput" placeholder="Type to search or add tags..." autocomplete="off">
            </section>
            <datalist id="tagSuggestions"></datalist>
            <menu id="tagSuggestionsMenu" class="tag-suggestions-menu" hidden></menu>
          </fieldset>

          <fieldset id="conditionalRedirectFieldset">
            <legend>
              <label class="checkbox-label-inline">
                <input type="checkbox" id="conditionalRedirectToggle">
                Conditional Redirect (optional)
              </label>
            </legend>
            
            <section id="conditionalRedirectOptions" hidden>
              <ul class="conditional-category-list">
                <li>
                  <label class="checkbox-label-inline">
                    <input type="checkbox" id="langLocaleToggle">
                    Lang-locale
                  </label>
                </li>
                <li>
                  <label class="checkbox-label-inline">
                    <input type="checkbox" id="desktopToggle">
                    Desktop
                  </label>
                </li>
                <li>
                  <label class="checkbox-label-inline">
                    <input type="checkbox" id="mobileToggle">
                    Mobile
                  </label>
                </li>
              </ul>

              <section id="langLocaleSection" class="conditional-section" hidden>
                <h4>Lang-locale Redirects</h4>
                <ul id="langLocaleList" class="lang-locale-list"></ul>
                <button type="button" id="addLangLocaleBtn" class="btn-secondary">+ Add lang-locale</button>
              </section>

              <section id="desktopSection" class="conditional-section" hidden>
                <h4>Desktop Redirects</h4>
                <label>
                  Windows:
                  <input type="url" id="windowsUrl" placeholder="https://example.com/windows">
                </label>
                <label>
                  Mac OS:
                  <input type="url" id="macosUrl" placeholder="https://example.com/macos">
                </label>
                <label>
                  Linux:
                  <input type="url" id="linuxUrl" placeholder="https://example.com/linux">
                </label>
                <label>
                  ChromeOS:
                  <input type="url" id="chromeosUrl" placeholder="https://example.com/chromeos">
                </label>
              </section>

              <section id="mobileSection" class="conditional-section" hidden>
                <h4>Mobile Redirects</h4>
                <label>
                  Android:
                  <input type="url" id="androidUrl" placeholder="https://example.com/android">
                </label>
                <label>
                  iOS:
                  <input type="url" id="iosUrl" placeholder="https://example.com/ios">
                </label>
                <label>
                  iPadOS:
                  <input type="url" id="ipadosUrl" placeholder="https://example.com/ipados">
                </label>
              </section>
            </section>
          </fieldset>

          <label>
            Case Sensitive:
            <input type="checkbox" name="isCaseSensitive">
          </label>

          <button type="submit">Create</button>
        </form>

        <p id="message"></p>

      </main>

    <footer class="classification">INTERNAL</footer>

    <script src="/internal/logout-nav.js"></script>
    <script src="/internal/new.js"></script>
    
  </body>
</html>
